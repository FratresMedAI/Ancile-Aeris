services:
  ancile-aeris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ancile_aeris
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ANCILE_PAYLOAD=${ANCILE_PAYLOAD:-cuas}
      - ANCILE_SIM_MODE=${ANCILE_SIM_MODE:-true}
      - ANCILE_LAUNCH_FILE=${ANCILE_LAUNCH_FILE:-ancile_aeris_basic_demo.launch.py}
    volumes:
      - ../:/opt/ancile_aeris_ws
    command: bash -lc "cd /opt/ancile_aeris_ws && find src -name '*.py' -exec sed -i 's/\r$//' {} + && chmod +x clean-build.sh 2>/dev/null || true && ./clean-build.sh && source install/setup.bash && ros2 launch ancile_aeris_bringup $${ANCILE_LAUNCH_FILE}"

  ancile-aeris-jetson:
    profiles: ["jetson"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ancile_aeris_jetson
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ANCILE_PAYLOAD=${ANCILE_PAYLOAD:-cuas}
      - ANCILE_SIM_MODE=${ANCILE_SIM_MODE:-true}
      - ANCILE_LAUNCH_FILE=${ANCILE_LAUNCH_FILE:-ancile_aeris_basic_demo.launch.py}
    volumes:
      - ../:/opt/ancile_aeris_ws
    command: bash -lc "cd /opt/ancile_aeris_ws && find src -name '*.py' -exec sed -i 's/\r$//' {} + && chmod +x clean-build.sh 2>/dev/null || true && ./clean-build.sh && source install/setup.bash && ros2 launch ancile_aeris_bringup $${ANCILE_LAUNCH_FILE}"

