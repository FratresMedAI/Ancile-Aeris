services:
  clearsky-os:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: clearsky_os
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CLEARSKY_PAYLOAD=${CLEARSKY_PAYLOAD:-cuas}
      - CLEARSKY_SIM_MODE=${CLEARSKY_SIM_MODE:-true}
      - CLEARSKY_LAUNCH_FILE=${CLEARSKY_LAUNCH_FILE:-clearsky_os_basic_demo.launch.py}
    volumes:
      - ../:/opt/clearsky_os_ws
    command: bash -lc "cd /opt/clearsky_os_ws && find src -name '*.py' -exec sed -i 's/\r$//' {} + && chmod +x clean-build.sh 2>/dev/null || true && ./clean-build.sh && source install/setup.bash && ros2 launch clearsky_os_bringup $${CLEARSKY_LAUNCH_FILE}"

  clearsky-os-jetson:
    profiles: ["jetson"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
    container_name: clearsky_os_jetson
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CLEARSKY_PAYLOAD=${CLEARSKY_PAYLOAD:-cuas}
      # Prefer real inference on Jetson when weights are mounted
      - CLEARSKY_SIM_MODE=${CLEARSKY_SIM_MODE:-false}
      - CLEARSKY_LAUNCH_FILE=${CLEARSKY_LAUNCH_FILE:-clearsky_os_basic_demo.launch.py}
      - CLEARSKY_VISUAL_SOURCE=${CLEARSKY_VISUAL_SOURCE:-}
    volumes:
      - ../:/opt/clearsky_os_ws
      - ../models:/opt/clearsky_os_ws/models
    command: bash -lc "cd /opt/clearsky_os_ws && find src -name '*.py' -exec sed -i 's/\r$//' {} + && chmod +x clean-build.sh 2>/dev/null || true && ./clean-build.sh && source install/setup.bash && ros2 launch clearsky_os_bringup $${CLEARSKY_LAUNCH_FILE}"
