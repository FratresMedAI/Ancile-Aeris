name: Ancile-Aeris CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:kilted-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions
      - name: Capability coverage summary
        run: |
          echo "Ancile-Aeris CI capability groups:"
          echo "- Perception: video_analytics, neuromorphic_sim, hyperspectral_stub"
          echo "- Cognition: adversarial_defense, agent_orchestrator, cognitive_ew, swarm_orchestrator"
          echo "- Decision: digital_twin, causal_xai, verification"
          echo "- Action/Resilience: copilot, federated_learning, continual_learning"
          echo "- Advanced coordination: defensive_swarm_coordinator, zero_knowledge_sharing, resilient_pnt, generative_red_team"
          echo "- Optional layered interceptors (default-off in config/launch): scout_mothership, baby_interceptor"
      - name: Build
        run: |
          source /opt/ros/kilted/setup.bash
          colcon list
          colcon build --symlink-install
      - name: Test
        run: |
          source /opt/ros/kilted/setup.bash
          source install/setup.bash
          colcon test
          colcon test-result --verbose
