apiVersion: apps/v1
kind: Deployment
metadata:
  name: counterdrone-core
  namespace: counterdroneos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counterdrone-core
  template:
    metadata:
      labels:
        app: counterdrone-core
    spec:
      containers:
        - name: counterdrone-core
          image: docker-counterdrone-x86:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc", "source /opt/ros/kilted/setup.bash && source /opt/counterdrone_ws/install/setup.bash && ros2 launch counterdrone_core full_system.launch.py sim_mode:=true"]
