# Ancile Aeris - Property of Fratres X AI
# Simulation-safe payload selector for demo and roadmap capabilities.

demo_profile: basic

features:
  # baseline LRBAA demo path: sensors, fusion, DARKSPACE, safety gate,
  # operator copilot, and scout_mothership. Note: scout_mothership always starts
  # when launching ancile_aeris_basic_demo.launch.py; this flag remains for tooling
  # and clarity (leave true for the standard slice).

  enable_copilot: true
  enable_scout_mothership: true

  # Mesh coordination topics (/mesh/...) — enabled by default in scout_config.yaml;
  # flag documents policy for integrators (Anduril Lattice-like mesh analogs).
  enable_mesh_mothership_coordination: true

  # Optional simulation-only interceptor. Default false: preserves defensive-only posture.
  # When true, aligns with YAML default unless overridden by ros2 launch enable_baby_interceptor:=...

  enable_baby_interceptor: false

  # Buildable local packages that are outside the basic demo slice.
  enable_agent_orchestrator: false
  enable_adversarial_defense: false
  enable_causal_xai: false
  enable_cognitive_ew: false
  enable_continual_learning: false
  enable_defensive_swarm_coordinator: false
  enable_digital_twin: false
  enable_federated_learning: false
  enable_generative_red_team: false
  enable_hyperspectral_stub: false
  enable_neuromorphic_sim: false
  enable_resilient_pnt: false
  enable_swarm_orchestrator: false
  enable_verification: false
  enable_video_analytics: false
  enable_zero_knowledge_sharing: false
