/fusion_node:
  ros__parameters:
    visual_topic: /sensor/visual/tracks
    thermal_topic: /sensor/thermal/tracks
    acoustic_topic: /sensor/acoustic/detections
    rf_topic: /sensor/rf/detections
    lidar_topic: /sensor/lidar/points
    sigint_topic: /sensor/sigint/elint
    fused_topic: /fused_tracks
    learned_topic: /fusion/learned_tracks
    publish_hz: 20.0
    min_confidence: 0.35
    pid_gate: 0.75
    fusion_model: cv_ekf
    association_gate: 3.0
    dt: 0.05
    image_scale_m: 1.0
    enable_learned_shadow: true
    learned_min_score: 0.35
    default_bearing_range_m: 150.0
