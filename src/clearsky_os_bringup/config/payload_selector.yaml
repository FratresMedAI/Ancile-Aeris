# Simulation-safe payload selector: Mothership FOB Swarm + micro payloads.
#
# Profile mothership_fob_standard (tunable):
#   - Forward Operating Base carriers: mesh_motherships.count in [2, 4] (scout motherships per area).
#   - Per-FOB micro-drone bay: micro_capacity_per_fob typically 10–12; micro_payloads slots sum must be <= capacity.

demo_profile: mothership_fob_standard

features:
  enable_copilot: true
  enable_clearsky_os_scout_mothership: true

  # 2–4 mobile FOB carriers (scout motherships as forward operating bases).
  mesh_motherships:
    enabled: true
    count: 3

  # Per-FOB micro-drone capacity (hot-swappable mix; sum must be <= micro_capacity_per_fob).
  micro_capacity_per_fob: 12
  micro_payloads:
    sensor_pod: 4
    acoustic_disruptor: 2
    kevlar_web: 2
    cognitive_ew_pod: 3
    kamikaze_ram_slots: 1

  # FOB coordinator + fleet views (simulation).
  mothership_fob_swarm:
    enabled: true
    coordinator_publish_hz: 1.0

  # Deprecated path (not launched from basic demo): legacy baby interceptor package.
  clearsky_os_baby_interceptor:
    enabled: false
    require_double_authorization: true

  # Kamikaze ram: single kinetic option — terminal kinetic-energy collision (simulation only).
  kamikaze_ram:
    enabled: false
    require_double_authorization: true

  # When true, effector policy may select kamikaze_ram at extreme confidence (last resort).
  allow_kinetic_ram_in_effector_policy: false

  # Non-kinetic ship effectors + cognitive demo chain.
  effectors:
    enabled: true
    enable_sim: true
  cognitive_demo_chain:
    enabled: true

  enable_agent_orchestrator: false
  enable_adversarial_defense: false
  enable_causal_xai: false
  enable_cognitive_ew: false
  enable_continual_learning: false
  enable_defensive_swarm_coordinator: false
  enable_digital_twin: true
  # Phase 3: Gazebo-compatible truth bridge (/sim/ground_truth); optional sensor override
  enable_sim_truth: true
  sim_override_sensors: false
  enable_federated_learning: false
  enable_generative_red_team: false
  enable_hyperspectral_stub: false
  enable_neuromorphic_sim: false
  enable_resilient_pnt: false
  enable_swarm_orchestrator: false
  enable_verification: false
  enable_video_analytics: false
  enable_zero_knowledge_sharing: false
